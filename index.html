<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Bridge 3D - Survive the Jump</title>
    <style>
        /* ============================================================
           GLASS BRIDGE 3D - COMPLETE STYLESHEET
           Modern dark UI with glassmorphism, animations & responsive
           ============================================================ */

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-dark: #0a0e17;
            --bg-panel: rgba(15, 25, 45, 0.85);
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff00aa;
            --accent-gold: #ffd700;
            --accent-green: #00ff88;
            --accent-red: #ff3355;
            --text-primary: #e8f0ff;
            --text-secondary: #8899bb;
            --glass-border: rgba(0, 240, 255, 0.35);
            --shadow-glow: 0 0 20px rgba(0, 240, 255, 0.4);
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            font-family: var(--font-body);
            color: var(--text-primary);
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* -------------------- OVERLAY UI -------------------- */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .overlay.active {
            pointer-events: auto;
            opacity: 1;
            visibility: visible;
        }

        .overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* -------------------- MENU SCREEN -------------------- */
        #menu-screen {
            background: radial-gradient(ellipse at center, rgba(10, 20, 40, 0.92) 0%, rgba(5, 8, 15, 0.97) 100%);
        }

        .menu-title {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-cyan), #ffffff, var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.5);
            margin-bottom: 0.3em;
            animation: titlePulse 3s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.15); }
        }

        .menu-subtitle {
            font-size: 1.4rem;
            color: var(--text-secondary);
            letter-spacing: 0.3em;
            margin-bottom: 2.5rem;
            text-transform: uppercase;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: min(320px, 85vw);
        }

        .menu-btn {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            padding: 1rem 1.5rem;
            border: 2px solid var(--glass-border);
            background: var(--bg-panel);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.15), transparent);
            transition: left 0.5s ease;
        }

        .menu-btn:hover::before {
            left: 100%;
        }

        .menu-btn:hover {
            border-color: var(--accent-cyan);
            box-shadow: var(--shadow-glow);
            transform: translateY(-3px) scale(1.02);
            color: var(--accent-cyan);
        }

        .menu-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .menu-btn.primary {
            background: linear-gradient(135deg, rgba(0, 180, 200, 0.3), rgba(0, 100, 150, 0.4));
            border-color: var(--accent-cyan);
        }

        .menu-btn.danger {
            border-color: rgba(255, 51, 85, 0.5);
        }

        .menu-btn.danger:hover {
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(255, 51, 85, 0.4);
            color: var(--accent-red);
        }

        .highscore-display {
            margin-top: 2.5rem;
            font-size: 1.15rem;
            color: var(--accent-gold);
            letter-spacing: 0.1em;
        }

        .highscore-display span {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.4rem;
        }

        .controls-hint {
            margin-top: 2rem;
            font-size: 0.95rem;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.7;
            max-width: 420px;
        }

        .controls-hint kbd {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            font-family: var(--font-body);
            font-size: 0.85rem;
            margin: 0 2px;
        }

        /* -------------------- HUD -------------------- */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #hud.visible {
            opacity: 1;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        .hud-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .hud-value {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .hud-value.gold {
            color: var(--accent-gold);
        }

        .hud-value.green {
            color: var(--accent-green);
        }

        .mode-badge {
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .mode-badge.normal {
            background: rgba(255, 51, 85, 0.2);
            color: var(--accent-red);
            border: 1px solid rgba(255, 51, 85, 0.4);
        }

        .mode-badge.practice {
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 136, 0.35);
        }

        .side-indicator {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .side-indicator.visible {
            opacity: 1;
        }

        .side-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid var(--glass-border);
            background: var(--bg-panel);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            pointer-events: auto;
            cursor: pointer;
        }

        .side-btn.selected {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            transform: scale(1.1);
        }

        .jump-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            color: var(--text-secondary);
            letter-spacing: 0.08em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .jump-hint.visible {
            opacity: 1;
        }

        .message-banner {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-shadow: 0 0 30px currentColor;
            pointer-events: none;
        }

        .message-banner.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .message-banner.danger {
            color: var(--accent-red);
        }

        .message-banner.success {
            color: var(--accent-green);
        }

        .message-banner.info {
            color: var(--accent-cyan);
        }

        /* -------------------- GAME OVER / WIN -------------------- */
        #result-screen {
            background: radial-gradient(ellipse at center, rgba(10, 15, 30, 0.9) 0%, rgba(5, 5, 12, 0.96) 100%);
        }

        .result-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 7vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 0.12em;
            margin-bottom: 1rem;
        }

        .result-title.lose {
            color: var(--accent-red);
            text-shadow: 0 0 40px rgba(255, 51, 85, 0.6);
        }

        .result-title.win {
            color: var(--accent-green);
            text-shadow: 0 0 40px rgba(0, 255, 136, 0.6);
        }

        .result-score {
            font-size: 1.6rem;
            margin: 0.8rem 0;
            color: var(--text-primary);
        }

        .result-score span {
            font-family: var(--font-display);
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .new-high {
            font-size: 1.2rem;
            color: var(--accent-gold);
            letter-spacing: 0.15em;
            margin: 1rem 0 2rem;
            animation: pulseGold 1.2s ease-in-out infinite;
        }

        @keyframes pulseGold {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.05); }
        }

        /* -------------------- LOADING -------------------- */
        #loading-screen {
            background: var(--bg-dark);
            z-index: 100;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-family: var(--font-display);
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            color: var(--accent-cyan);
        }

        /* -------------------- PROGRESS BAR -------------------- */
        .progress-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: min(400px, 80vw);
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .progress-container.visible {
            opacity: 1;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
            border-radius: 3px;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        /* -------------------- RESPONSIVE -------------------- */
        @media (max-width: 600px) {
            .menu-title {
                font-size: 2.2rem;
            }
            .hud-value {
                font-size: 1.2rem;
            }
            .side-btn {
                width: 56px;
                height: 56px;
                font-size: 1.1rem;
            }
        }

        /* -------------------- CROSSHAIR / CENTER -------------------- */
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: rgba(0, 240, 255, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            z-index: 4;
        }

        .center-dot.visible {
            opacity: 1;
        }

        /* -------------------- FOOTER CREDIT -------------------- */
        .credit {
            position: absolute;
            bottom: 12px;
            right: 16px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.05em;
            z-index: 6;
        }
        .mobile-jump-btn {
            display: none;
            position: absolute;
            right: 22px;
            bottom: 28px;
            width: 100px;
            height: 64px;
            border: 2px solid var(--accent-cyan);
            border-radius: 16px;
            background: rgba(15, 25, 45, 0.9);
            color: var(--accent-cyan);
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
            backdrop-filter: blur(12px);
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            z-index: 20;
        }

        .mobile-jump-btn:active {
            transform: scale(0.92);
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        @media (max-width: 600px) {
            .mobile-jump-btn {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
            </style>
</head>
<body>
    <div id="game-container">
        <div id="canvas-container"></div>

        <!-- LOADING -->
        <div id="loading-screen" class="overlay active">
            <div class="loader"></div>
            <div class="loading-text">LOADING BRIDGE...</div>
        </div>

        <!-- MAIN MENU -->
        <div id="menu-screen" class="overlay hidden">
            <h1 class="menu-title">GLASS BRIDGE</h1>
            <p class="menu-subtitle">3D • Survive or Shatter</p>
            <div class="menu-buttons">
                <button class="menu-btn primary" id="btn-play-normal">PLAY NORMAL</button>
                <button class="menu-btn" id="btn-play-practice">PRACTICE MODE</button>
                <button class="menu-btn danger" id="btn-quit">QUIT</button>
            </div>
            <div class="highscore-display">HIGH SCORE: <span id="menu-highscore">0</span></div>
            <div class="controls-hint">
                <kbd>A</kbd> / <kbd>←</kbd> Left &nbsp; <kbd>D</kbd> / <kbd>→</kbd> Right<br>
                <kbd>SPACE</kbd> / <kbd>W</kbd> Jump &nbsp; <kbd>ESC</kbd> Menu
            </div>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div class="hud-top">
                <div class="hud-panel">
                    <div class="hud-label">Score</div>
                    <div class="hud-value" id="hud-score">0</div>
                </div>
                <div class="hud-panel" style="text-align:center;">
                    <div class="hud-label">Progress</div>
                    <div class="hud-value green" id="hud-progress">0 / 12</div>
                </div>
                <div class="hud-panel" style="text-align:right;">
                    <div class="hud-label">High Score</div>
                    <div class="hud-value gold" id="hud-highscore">0</div>
                    <div style="margin-top:6px;">
                        <span class="mode-badge normal" id="hud-mode">NORMAL</span>
                    </div>
                </div>
            </div>
            <div class="side-indicator" id="side-indicator">
                <div class="side-btn selected" id="side-left" data-side="0">L</div>
                <div class="side-btn" id="side-right" data-side="1">R</div>
            </div>
            <button class="mobile-jump-btn" id="mobile-jump-btn" type="button">
                JUMP ↑
            </button>
            <div class="jump-hint" id="jump-hint">Press SPACE to jump</div>
            <div class="message-banner" id="message-banner"></div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="overlay hidden">
            <h1 class="result-title lose" id="result-title">GAME OVER</h1>
            <div class="result-score">Score: <span id="result-score">0</span></div>
            <div class="result-score">High Score: <span id="result-highscore">0</span></div>
            <div class="new-high" id="new-high" style="display:none;">★ NEW HIGH SCORE ★</div>
            <div class="menu-buttons" style="margin-top:1.5rem;">
                <button class="menu-btn primary" id="btn-restart">PLAY AGAIN</button>
                <button class="menu-btn" id="btn-menu">MAIN MENU</button>
            </div>
        </div>

        <div class="center-dot" id="center-dot"></div>
        <div class="credit">Glass Bridge 3D • Three.js</div>
    </div>

    <!-- Three.js r128 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /* ============================================================================
           GLASS BRIDGE 3D - FULL GAME ENGINE
           Built with Three.js | 2000+ lines of pure gameplay systems
           Features: 3D glass panels, shatter physics, particles,
                     camera follow, lighting, UI, highscore, modes
           ============================================================================ */

        'use strict';

        // ========================================================================
        // SECTION 1: CONSTANTS & CONFIGURATION
        // ========================================================================

        const CONFIG = {
            // Bridge layout
            NUM_ROWS: 12,
            TILE_WIDTH: 3.2,
            TILE_DEPTH: 2.4,
            TILE_HEIGHT: 0.18,
            GAP_X: 1.8,
            GAP_Z: 0.9,
            BRIDGE_START_Z: 0,

            // Player
            PLAYER_RADIUS: 0.45,
            PLAYER_HEIGHT: 1.6,
            JUMP_DURATION: 0.85,        // seconds
            JUMP_HEIGHT: 2.8,

            // Camera
            CAM_OFFSET_Y: 8,
            CAM_OFFSET_Z: 14,
            CAM_LOOK_AHEAD: 4,
            CAM_SMOOTH: 0.06,

            // Physics / feel
            GRAVITY: 28,
            FALL_ROTATION_SPEED: 3.5,

            // Visual
            FOG_COLOR: 0x0a0e17,
            FOG_NEAR: 25,
            FOG_FAR: 90,
            AMBIENT_INTENSITY: 0.35,
            DIR_LIGHT_INTENSITY: 1.1,

            // Gameplay
            SCORE_PER_TILE: 10,
            SCORE_FINISH: 150,
            PRACTICE_MODE_SAFE: true,

            PRACTICE_WARNING_MIN_DELAY: 1.5,
            PRACTICE_WARNING_MAX_DELAY: 3.5,
            PRACTICE_WARNING_DURATION: 2.5,

            // Highscore key
            HS_KEY: 'glassBridge3D_highscore_v1'
        };

        // Color palette for materials
        const COLORS = {
            bg: 0x0a0e17,
            platformStart: 0x22cc66,
            platformEnd: 0xffcc00,
            glassSafe: 0xaaddff,
            glassBreakable: 0xcceeff,
            glassBroken: 0x334455,
            playerBody: 0xff4466,
            playerAccent: 0xffffff,
            particleGlass: 0xaaccff,
            particleSpark: 0xffffff,
            voidBelow: 0x050810
        };

        // ========================================================================
        // SECTION 2: UTILITY FUNCTIONS
        // ========================================================================

        const Utils = {
            /**
             * Linear interpolation
             */
            lerp(a, b, t) {
                return a + (b - a) * t;
            },

            /**
             * Clamp value between min and max
             */
            clamp(v, min, max) {
                return Math.max(min, Math.min(max, v));
            },

            /**
             * Random float between min and max
             */
            rand(min, max) {
                return Math.random() * (max - min) + min;
            },

            /**
             * Random integer between min and max (inclusive)
             */
            randInt(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            },

            /**
             * Ease in-out cubic
             */
            easeInOutCubic(t) {
                return t < 0.5
                    ? 4 * t * t * t
                    : 1 - Math.pow(-2 * t + 2, 3) / 2;
            },

            /**
             * Ease out bounce (for landing feel)
             */
            easeOutBounce(t) {
                const n1 = 7.5625;
                const d1 = 2.75;
                if (t < 1 / d1) return n1 * t * t;
                if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
                if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
                return n1 * (t -= 2.625 / d1) * t + 0.984375;
            },

            /**
             * Generate a unique id
             */
            uid() {
                return Math.random().toString(36).substr(2, 9);
            },

            /**
             * Deg to rad
             */
            degToRad(d) {
                return d * Math.PI / 180;
            },

            /**
             * Simple deep clone for plain objects
             */
            clone(obj) {
                return JSON.parse(JSON.stringify(obj));
            },

            /**
             * Format number with commas
             */
            formatNumber(n) {
                return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            },

            /**
             * Create a simple text sprite (fallback, not heavily used)
             */
            createTextSprite(message, opts = {}) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const fontSize = opts.fontSize || 48;
                ctx.font = `Bold ${fontSize}px Orbitron, Arial`;
                const metrics = ctx.measureText(message);
                canvas.width = metrics.width + 40;
                canvas.height = fontSize + 30;
                ctx.font = `Bold ${fontSize}px Orbitron, Arial`;
                ctx.fillStyle = opts.color || '#00f0ff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(message, canvas.width / 2, canvas.height / 2);
                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(material);
                sprite.scale.set(canvas.width / 40, canvas.height / 40, 1);
                return sprite;
            }
        };

        // ========================================================================
        // SECTION 3: PARTICLE SYSTEM
        // ========================================================================

        class Particle {
            constructor(position, velocity, color, size, life, type = 'glass') {
                this.position = position.clone();
                this.velocity = velocity.clone();
                this.color = color;
                this.size = size;
                this.maxLife = life;
                this.life = life;
                this.type = type;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = Utils.rand(-8, 8);
                this.gravity = type === 'spark' ? 4 : 18;
                this.mesh = null;
            }

            update(dt) {
                this.life -= dt;
                if (this.life <= 0) return false;

                this.velocity.y -= this.gravity * dt;
                this.position.addScaledVector(this.velocity, dt);
                this.rotation += this.rotationSpeed * dt;

                if (this.mesh) {
                    this.mesh.position.copy(this.position);
                    this.mesh.rotation.z = this.rotation;
                    this.mesh.rotation.x += dt * 2;
                    const alpha = Math.max(0, this.life / this.maxLife);
                    if (this.mesh.material) {
                        this.mesh.material.opacity = alpha;
                        this.mesh.scale.setScalar(this.size * (0.5 + alpha * 0.5));
                    }
                }
                return true;
            }
        }

        class ParticleSystem {
            constructor(scene) {
                this.scene = scene;
                this.particles = [];
                this.pool = [];
                this.maxParticles = 400;
            }

            /**
             * Spawn a glass shatter burst
             */
            spawnShatter(position, count = 45) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const elev = Utils.rand(-0.4, 1.2);
                    const speed = Utils.rand(4, 14);
                    const velocity = new THREE.Vector3(
                        Math.cos(angle) * speed * Utils.rand(0.6, 1.2),
                        elev * speed + Utils.rand(2, 8),
                        Math.sin(angle) * speed * Utils.rand(0.6, 1.2)
                    );
                    const size = Utils.rand(0.08, 0.35);
                    const life = Utils.rand(0.8, 2.2);
                    const color = Math.random() > 0.3 ? COLORS.particleGlass : 0xffffff;
                    this._addParticle(position, velocity, color, size, life, 'glass');
                }
                // Sparks
                for (let i = 0; i < 18; i++) {
                    const velocity = new THREE.Vector3(
                        Utils.rand(-6, 6),
                        Utils.rand(3, 12),
                        Utils.rand(-6, 6)
                    );
                    this._addParticle(position, velocity, 0xffffff, Utils.rand(0.04, 0.12), Utils.rand(0.4, 1.0), 'spark');
                }
            }

            /**
             * Spawn landing dust / impact
             */
            spawnLanding(position) {
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    const velocity = new THREE.Vector3(
                        Math.cos(angle) * Utils.rand(1.5, 3.5),
                        Utils.rand(0.5, 2.5),
                        Math.sin(angle) * Utils.rand(1.5, 3.5)
                    );
                    this._addParticle(position, velocity, 0xaaddff, Utils.rand(0.06, 0.15), Utils.rand(0.4, 0.9), 'spark');
                }
            }

            /**
             * Spawn celebration particles at finish
             */
            spawnCelebration(position) {
                for (let i = 0; i < 80; i++) {
                    const velocity = new THREE.Vector3(
                        Utils.rand(-10, 10),
                        Utils.rand(5, 18),
                        Utils.rand(-10, 10)
                    );
                    const colors = [0x00ff88, 0x00f0ff, 0xffd700, 0xff00aa, 0xffffff];
                    const color = colors[Utils.randInt(0, colors.length - 1)];
                    this._addParticle(position, velocity, color, Utils.rand(0.1, 0.3), Utils.rand(1.5, 3.0), 'spark');
                }
            }

            _addParticle(pos, vel, color, size, life, type) {
                if (this.particles.length >= this.maxParticles) {
                    // Recycle oldest
                    const old = this.particles.shift();
                    if (old.mesh) {
                        this.scene.remove(old.mesh);
                        if (old.mesh.geometry) old.mesh.geometry.dispose();
                        if (old.mesh.material) old.mesh.material.dispose();
                    }
                }

                const p = new Particle(pos, vel, color, size, life, type);

                // Create visual
                let geometry, material;
                if (type === 'glass') {
                    // Thin box shards
                    const sx = Utils.rand(0.1, 0.4);
                    const sy = Utils.rand(0.02, 0.08);
                    const sz = Utils.rand(0.15, 0.5);
                    geometry = new THREE.BoxGeometry(sx, sy, sz);
                    material = new THREE.MeshStandardMaterial({
                        color: color,
                        transparent: true,
                        opacity: 0.85,
                        metalness: 0.3,
                        roughness: 0.15,
                        side: THREE.DoubleSide
                    });
                } else {
                    geometry = new THREE.SphereGeometry(size * 0.5, 6, 6);
                    material = new THREE.MeshBasicMaterial({
                        color: color,
                        transparent: true,
                        opacity: 1
                    });
                }

                p.mesh = new THREE.Mesh(geometry, material);
                p.mesh.position.copy(pos);
                this.scene.add(p.mesh);
                this.particles.push(p);
            }

            update(dt) {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const alive = this.particles[i].update(dt);
                    if (!alive) {
                        const p = this.particles[i];
                        if (p.mesh) {
                            this.scene.remove(p.mesh);
                            if (p.mesh.geometry) p.mesh.geometry.dispose();
                            if (p.mesh.material) p.mesh.material.dispose();
                        }
                        this.particles.splice(i, 1);
                    }
                }
            }

            clear() {
                for (const p of this.particles) {
                    if (p.mesh) {
                        this.scene.remove(p.mesh);
                        if (p.mesh.geometry) p.mesh.geometry.dispose();
                        if (p.mesh.material) p.mesh.material.dispose();
                    }
                }
                this.particles = [];
            }
        }

        // ========================================================================
        // SECTION 4: GLASS TILE CLASS
        // ========================================================================

        class GlassTile {
            constructor(row, col, isSafe, scene) {
                this.row = row;
                this.col = col;
                this.isSafe = isSafe;
                this.broken = false;
                this.highlight = false;
                this.scene = scene;
                this.group = new THREE.Group();
                this.mesh = null;
                this.border = null;
                this.glow = null;
                this.shakeTimer = 0;
                this.originalPos = new THREE.Vector3();
                this.practiceWarning = false;

                this._build();
            }

            _build() {
                const w = CONFIG.TILE_WIDTH;
                const d = CONFIG.TILE_DEPTH;
                const h = CONFIG.TILE_HEIGHT;

                // Main glass slab
                const geo = new THREE.BoxGeometry(w, h, d);
                const mat = new THREE.MeshPhysicalMaterial({
                    color: this.isSafe ? COLORS.glassSafe : COLORS.glassBreakable,
                    metalness: 0.05,
                    roughness: 0.05,
                    transmission: 0.85,
                    thickness: 0.5,
                    transparent: true,
                    opacity: 0.55,
                    side: THREE.DoubleSide,
                    envMapIntensity: 1.2
                });

                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                this.group.add(this.mesh);

                // Edge frame
                const edgeGeo = new THREE.EdgesGeometry(geo);
                const edgeMat = new THREE.LineBasicMaterial({
                    color: 0x88ccff,
                    transparent: true,
                    opacity: 0.7
                });
                this.border = new THREE.LineSegments(edgeGeo, edgeMat);
                this.group.add(this.border);

                // Soft glow underneath (subtle)
                const glowGeo = new THREE.PlaneGeometry(w * 0.95, d * 0.95);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0x44aaff,
                    transparent: true,
                    opacity: 0.08,
                    side: THREE.DoubleSide
                });
                this.glow = new THREE.Mesh(glowGeo, glowMat);
                this.glow.rotation.x = -Math.PI / 2;
                this.glow.position.y = -0.05;
                this.group.add(this.glow);

                // Position will be set by bridge
            }

            setPosition(x, y, z) {
                this.group.position.set(x, y, z);
                this.originalPos.set(x, y, z);
            }

            breakGlass() {
                if (this.broken) return;
                this.broken = true;
                this.shakeTimer = 0.35;

                // Hide original mesh, leave faint debris plane
                if (this.mesh) {
                    this.mesh.visible = false;
                }
                if (this.border) {
                    this.border.visible = false;
                }
                if (this.glow) {
                    this.glow.material.opacity = 0.02;
                    this.glow.material.color.setHex(0x222233);
                }
            }

            setHighlight(on) {
                this.highlight = on;
                if (this.border && !this.broken) {
                    this.border.material.color.setHex(on ? 0x00ff88 : 0x88ccff);
                    this.border.material.opacity = on ? 1.0 : 0.7;
                }
                if (this.mesh && !this.broken) {
                    this.mesh.material.emissive = new THREE.Color(on ? 0x004422 : 0x000000);
                    this.mesh.material.emissiveIntensity = on ? 0.25 : 0;
                }
            }

            setPracticeWarning(on) {
                this.practiceWarning = on;

                if (this.border && !this.broken) {
                    this.border.material.color.setHex(on ? 0xff3355 : 0x88ccff);
                    this.border.material.opacity = on ? 1.0 : 0.7;
                }

                if (this.mesh && !this.broken) {
                    this.mesh.material.emissive = new THREE.Color(on ? 0x550011 : 0x000000);
                    this.mesh.material.emissiveIntensity = on ? 0.55 : 0;
                }

                if (this.glow && !this.broken) {
                    this.glow.material.color.setHex(on ? 0xff1133 : 0x44aaff);
                    this.glow.material.opacity = on ? 0.22 : 0.08;
                }
            }

            update(dt) {
                if (this.shakeTimer > 0) {
                    this.shakeTimer -= dt;
                    const intensity = this.shakeTimer * 0.4;
                    this.group.position.x = this.originalPos.x + (Math.random() - 0.5) * intensity;
                    this.group.position.z = this.originalPos.z + (Math.random() - 0.5) * intensity;
                    if (this.shakeTimer <= 0) {
                        this.group.position.copy(this.originalPos);
                    }
                }
            }

            dispose() {
                this.group.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        if (Array.isArray(obj.material)) {
                            obj.material.forEach(m => m.dispose());
                        } else {
                            obj.material.dispose();
                        }
                    }
                });
            }
        }

        // ========================================================================
        // SECTION 5: PLAYER CLASS
        // ========================================================================

        class Player {
            constructor(scene) {
                this.scene = scene;
                this.group = new THREE.Group();
                this.alive = true;
                this.falling = false;
                this.jumping = false;
                this.jumpProgress = 0;
                this.jumpDuration = CONFIG.JUMP_DURATION;
                this.startPos = new THREE.Vector3();
                this.targetPos = new THREE.Vector3();
                this.side = 0;
                this.row = -1;
                this.fallVelocity = new THREE.Vector3();
                this.fallRotation = new THREE.Vector3();
                this.bobPhase = 0;

                this._buildModel();
                scene.add(this.group);
            }

            _buildModel() {
                // Simple stylized humanoid
                const bodyMat = new THREE.MeshStandardMaterial({
                    color: COLORS.playerBody,
                    metalness: 0.2,
                    roughness: 0.5
                });
                const accentMat = new THREE.MeshStandardMaterial({
                    color: COLORS.playerAccent,
                    metalness: 0.1,
                    roughness: 0.4
                });

                // Torso
                const torso = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.28, 0.32, 0.75, 12),
                    bodyMat
                );

                torso.position.y = 0.85;
                torso.castShadow = true;
                this.group.add(torso);

                // Head
                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.28, 16, 16),
                    accentMat
                );
                head.position.y = 1.55;
                head.castShadow = true;
                this.group.add(head);

                // Eyes
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
                const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), eyeMat);
                leftEye.position.set(-0.1, 1.58, 0.22);
                this.group.add(leftEye);
                const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), eyeMat);
                rightEye.position.set(0.1, 1.58, 0.22);
                this.group.add(rightEye);

                // Arms
                // const armGeo = new THREE.CapsuleGeometry(0.08, 0.4, 4, 8);
                const armGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.55, 8);
                const leftArm = new THREE.Mesh(armGeo, bodyMat);
                leftArm.position.set(-0.4, 0.9, 0);
                leftArm.rotation.z = 0.3;
                leftArm.castShadow = true;
                this.group.add(leftArm);
                this.leftArm = leftArm;

                const rightArm = new THREE.Mesh(armGeo, bodyMat);
                rightArm.position.set(0.4, 0.9, 0);
                rightArm.rotation.z = -0.3;
                rightArm.castShadow = true;
                this.group.add(rightArm);
                this.rightArm = rightArm;

                // Legs
                // const legGeo = new THREE.CapsuleGeometry(0.1, 0.45, 4, 8);
                const legGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.55, 8);
                const leftLeg = new THREE.Mesh(legGeo, bodyMat);
                leftLeg.position.set(-0.15, 0.3, 0);
                leftLeg.castShadow = true;
                this.group.add(leftLeg);
                this.leftLeg = leftLeg;

                const rightLeg = new THREE.Mesh(legGeo, bodyMat);
                rightLeg.position.set(0.15, 0.3, 0);
                rightLeg.castShadow = true;
                this.group.add(rightLeg);
                this.rightLeg = rightLeg;

                // Simple ground shadow disc
                const shadowGeo = new THREE.CircleGeometry(0.5, 24);
                const shadowMat = new THREE.MeshBasicMaterial({
                    color: 0x000000,
                    transparent: true,
                    opacity: 0.35,
                    depthWrite: false
                });
                this.shadow = new THREE.Mesh(shadowGeo, shadowMat);
                this.shadow.rotation.x = -Math.PI / 2;
                this.shadow.position.y = 0.02;
                this.group.add(this.shadow);
            }

            setPosition(x, y, z) {
                this.group.position.set(x, y, z);
            }

            getPosition() {
                return this.group.position.clone();
            }

            startJump(targetX, targetY, targetZ, side) {
                if (this.jumping || this.falling || !this.alive) return false;
                this.startPos.copy(this.group.position);
                this.targetPos.set(targetX, targetY, targetZ);
                this.jumping = true;
                this.jumpProgress = 0;
                this.side = side;
                return true;
            }

            update(dt) {
                if (!this.alive && !this.falling) return;

                if (this.falling) {
                    this.fallVelocity.y -= CONFIG.GRAVITY * dt;
                    this.group.position.addScaledVector(this.fallVelocity, dt);
                    this.group.rotation.x += this.fallRotation.x * dt;
                    this.group.rotation.z += this.fallRotation.z * dt;
                    // Fade shadow
                    if (this.shadow) {
                        this.shadow.material.opacity = Math.max(0, this.shadow.material.opacity - dt * 0.8);
                    }
                    if (this.group.position.y < -40) {
                        this.alive = false;
                    }
                    return;
                }

                if (this.jumping) {
                    this.jumpProgress += dt / this.jumpDuration;
                    let t = Utils.clamp(this.jumpProgress, 0, 1);
                    t = Utils.easeInOutCubic(t);

                    // Horizontal lerp
                    this.group.position.x = Utils.lerp(this.startPos.x, this.targetPos.x, t);
                    this.group.position.z = Utils.lerp(this.startPos.z, this.targetPos.z, t);

                    // Parabolic arc
                    const arc = Math.sin(t * Math.PI) * CONFIG.JUMP_HEIGHT;
                    this.group.position.y = Utils.lerp(this.startPos.y, this.targetPos.y, t) + arc;

                    // Arm swing during jump
                    if (this.leftArm && this.rightArm) {
                        this.leftArm.rotation.x = Math.sin(t * Math.PI) * 0.8;
                        this.rightArm.rotation.x = Math.sin(t * Math.PI) * 0.8;
                    }

                    if (this.jumpProgress >= 1) {
                        this.jumping = false;
                        this.group.position.copy(this.targetPos);
                        if (this.leftArm) this.leftArm.rotation.x = 0;
                        if (this.rightArm) this.rightArm.rotation.x = 0;
                    }
                } else {
                    // Idle bob
                    this.bobPhase += dt * 3;
                    const bob = Math.sin(this.bobPhase) * 0.03;
                    // Keep y stable, just subtle scale
                    if (this.leftLeg && this.rightLeg) {
                        this.leftLeg.rotation.x = Math.sin(this.bobPhase) * 0.08;
                        this.rightLeg.rotation.x = -Math.sin(this.bobPhase) * 0.08;
                    }
                }
            }

            triggerFall() {
                this.falling = true;
                this.jumping = false;
                this.fallVelocity.set(
                    Utils.rand(-2, 2),
                    2,
                    Utils.rand(-1, 1)
                );
                this.fallRotation.set(
                    Utils.rand(2, 5),
                    0,
                    Utils.rand(-3, 3)
                );
            }

            reset() {
                this.alive = true;
                this.falling = false;
                this.jumping = false;
                this.jumpProgress = 0;
                this.row = -1;
                this.side = 0;
                this.fallVelocity.set(0, 0, 0);
                this.group.rotation.set(0, 0, 0);
                if (this.shadow) this.shadow.material.opacity = 0.35;
                if (this.leftArm) this.leftArm.rotation.set(0, 0, 0.3);
                if (this.rightArm) this.rightArm.rotation.set(0, 0, -0.3);
            }

            dispose() {
                this.group.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                        else obj.material.dispose();
                    }
                });
                this.scene.remove(this.group);
            }
        }

        // ========================================================================
        // SECTION 6: BRIDGE BUILDER
        // ========================================================================

        class Bridge {
            constructor(scene) {
                this.scene = scene;
                this.tiles = [];
                this.safePattern = [];
                this.startPlatform = null;
                this.endPlatform = null;
                this.sideRails = [];
                this.group = new THREE.Group();
                scene.add(this.group);
            }

            generate(numRows = CONFIG.NUM_ROWS) {
                this.clear();
                this.safePattern = [];
                for (let r = 0; r < numRows; r++) {
                    this.safePattern.push(Math.random() < 0.5 ? 0 : 1);
                }

                const halfGap = CONFIG.GAP_X / 2 + CONFIG.TILE_WIDTH / 2;
                const startZ = CONFIG.BRIDGE_START_Z;

                // Create tiles
                for (let r = 0; r < numRows; r++) {
                    const z = startZ - r * (CONFIG.TILE_DEPTH + CONFIG.GAP_Z);
                    for (let c = 0; c < 2; c++) {
                        const x = c === 0 ? -halfGap : halfGap;
                        const isSafe = (c === this.safePattern[r]);
                        const tile = new GlassTile(r, c, isSafe, this.scene);
                        tile.setPosition(x, 0, z);
                        this.group.add(tile.group);
                        this.tiles.push(tile);
                    }
                }

                // Start platform (closer to camera, positive Z relative to first tile)
                const startZPos = startZ + CONFIG.TILE_DEPTH + 2.5;
                this.startPlatform = this._createPlatform(
                    7, 0.3, 4,
                    COLORS.platformStart,
                    0, -0.05, startZPos,
                    'START'
                );
                this.group.add(this.startPlatform);

                // End platform
                const endZ = startZ - numRows * (CONFIG.TILE_DEPTH + CONFIG.GAP_Z) - 1.5;
                this.endPlatform = this._createPlatform(
                    7, 0.3, 4,
                    COLORS.platformEnd,
                    0, -0.05, endZ,
                    'FINISH'
                );
                this.group.add(this.endPlatform);

                // Side decorative rails / pillars
                this._buildRails(numRows, startZ, endZ);

                return {
                    startPos: new THREE.Vector3(0, 0, startZPos),
                    endPos: new THREE.Vector3(0, 0, endZ),
                    numRows
                };
            }

            _createPlatform(w, h, d, color, x, y, z, label) {
                const group = new THREE.Group();
                const geo = new THREE.BoxGeometry(w, h, d);
                const mat = new THREE.MeshStandardMaterial({
                    color: color,
                    metalness: 0.3,
                    roughness: 0.4,
                    emissive: color,
                    emissiveIntensity: 0.15
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                group.add(mesh);

                // Top edge light strip
                const stripGeo = new THREE.BoxGeometry(w * 0.98, 0.04, 0.08);
                const stripMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const strip1 = new THREE.Mesh(stripGeo, stripMat);
                strip1.position.set(0, h / 2 + 0.02, d / 2 - 0.1);
                group.add(strip1);
                const strip2 = strip1.clone();
                strip2.position.z = -d / 2 + 0.1;
                group.add(strip2);

                group.position.set(x, y, z);
                return group;
            }

            _buildRails(numRows, startZ, endZ) {
                const railMat = new THREE.MeshStandardMaterial({
                    color: 0x223344,
                    metalness: 0.6,
                    roughness: 0.3
                });
                const totalLength = Math.abs(endZ - startZ) + 8;
                const midZ = (startZ + endZ) / 2;

                // Left and right long beams
                for (const side of [-1, 1]) {
                    const beam = new THREE.Mesh(
                        new THREE.BoxGeometry(0.25, 0.25, totalLength),
                        railMat
                    );
                    beam.position.set(side * 6.5, 1.2, midZ);
                    beam.castShadow = true;
                    this.group.add(beam);
                    this.sideRails.push(beam);

                    // Vertical posts
                    const postCount = Math.ceil(numRows / 2) + 2;
                    for (let i = 0; i < postCount; i++) {
                        const t = i / (postCount - 1);
                        const z = Utils.lerp(startZ + 3, endZ - 2, t);
                        const post = new THREE.Mesh(
                            new THREE.BoxGeometry(0.2, 2.4, 0.2),
                            railMat
                        );
                        post.position.set(side * 6.5, 0.2, z);
                        post.castShadow = true;
                        this.group.add(post);
                        this.sideRails.push(post);
                    }
                }
            }

            getTile(row, col) {
                return this.tiles.find(t => t.row === row && t.col === col) || null;
            }

            getTileWorldPos(row, col) {
                const tile = this.getTile(row, col);
                if (!tile) return null;
                return tile.group.position.clone();
            }

            update(dt) {
                for (const t of this.tiles) {
                    t.update(dt);
                }
            }

            clear() {
                for (const t of this.tiles) {
                    t.dispose();
                    this.group.remove(t.group);
                }
                this.tiles = [];
                if (this.startPlatform) {
                    this.group.remove(this.startPlatform);
                    this.startPlatform = null;
                }
                if (this.endPlatform) {
                    this.group.remove(this.endPlatform);
                    this.endPlatform = null;
                }
                for (const r of this.sideRails) {
                    this.group.remove(r);
                    if (r.geometry) r.geometry.dispose();
                    if (r.material) r.material.dispose();
                }
                this.sideRails = [];
            }

            dispose() {
                this.clear();
                this.scene.remove(this.group);
            }
        }
